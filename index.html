<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Exámenes</title>
<link rel="manifest" href="manifest.json">
<style>
    body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f7f7f7;
        color: #333;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 5px;
        font-weight: 700;
    }

    h2 {
        font-size: 16px;
        margin-top: 0;
        color: #666;
        font-weight: 400;
    }

    .card {
        background: white;
        padding: 18px;
        border-radius: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    input, button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
        margin-bottom: 12px;
        font-size: 16px;
    }

    button {
        background: #7b4bff;
        color: white;
        border: none;
        font-weight: 600;
        cursor: pointer;
    }

    .colors {
        display: flex;
        gap: 10px;
        margin: 12px 0;
    }

    .color {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
    }

    .color.selected {
        border-color: black;
    }

    .exam {
        background: white;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
        border-left: 6px solid;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 30px 0;
        font-size: 16px;
    }
</style>
</head>

<body>

<h1>Mis Exámenes</h1>
<h2>Cuenta regresiva para cada prueba</h2>

<div class="card">
    <h3>+ Añadir examen</h3>

    <input id="asignatura" placeholder="Ej: Matemáticas">
    <input id="fecha" type="date">

    <div class="colors">
        <div class="color" data-color="#ff6b6b" style="background:#ff6b6b"></div>
        <div class="color" data-color="#4dabf7" style="background:#4dabf7"></div>
        <div class="color" data-color="#51cf66" style="background:#51cf66"></div>
        <div class="color" data-color="#845ef7" style="background:#845ef7"></div>
        <div class="color" data-color="#ffa94d" style="background:#ffa94d"></div>
        <div class="color" data-color="#f06595" style="background:#f06595"></div>
        <div class="color" data-color="#ffd43b" style="background:#ffd43b"></div> <!-- AMARILLO -->
    </div>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mis Exámenes</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c63ff">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: #f4f4ff;
    padding: 20px;
}

h1 {
    text-align: center;
    font-weight: 900;
    color: #6c63ff;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.card h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
}

.date {
    font-size: 16px;
    margin-top: 5px;
    color: #555;
}

.countdown {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 700;
    color: #6c63ff;
}
</style>
</head>

<body>

<h1>Mis Exámenes</h1>

<div id="lista"></div>

<script>
const examenes = [
    { nombre: "Matemáticas", fecha: "2025-06-10" },
    { nombre: "Lengua", fecha: "2025-06-15" },
    { nombre: "Historia", fecha: "2025-06-20" }
];

function actualizar() {
    const cont = document.getElementById("lista");
    cont.innerHTML = "";

    examenes.forEach(ex => {
        const fecha = new Date(ex.fecha);
        const hoy = new Date();
        const diff = Math.ceil((fecha - hoy) / (1000 * 60 * 60 * 24));

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h2>${ex.nombre}</h2>
            <div class="date">📅 ${ex.fecha}</div>
            <div class="countdown">${diff >= 0 ? diff + " días" : "Finalizado"}</div>
        `;

        cont.appendChild(card);
    });
}

actualizar();
setInterval(actualizar, 1000 * 60 * 60);
</script>

</body>
</html>
